<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Posts — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .field-label { font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .post-item { display: flex; gap: 16px; align-items: flex-start; }
    .post-thumb { width: 64px; height: 64px; border-radius: var(--nc-radius-md); object-fit: cover; background: #eee; flex-shrink: 0; }
    .post-body { flex: 1; min-width: 0; }
    .post-caption { margin: 2px 0 4px; }
    .post-error { color: #991b1b; font-size: 0.85rem; }
    .post-meta { font-size: 0.8rem; color: var(--nc-text-muted); }
    .loading-spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.5); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="/logo.png" alt="NC-IG" /><span>NC-IG</span></div>
      <nav class="sidebar-nav">
        <a href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          Beranda
        </a>
        <a href="/connection.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Koneksi
        </a>
        <a href="/dm.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          DM
        </a>
        <a href="/comments.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Komentar
        </a>
        <a href="/posts.html" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Posts
        </a>
        <a href="/stories.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          Stories
        </a>
        <a href="/templates.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="11" y2="11"/></svg>
          Template Balasan
        </a>
      </nav>
      <div class="sidebar-glow"></div>
      <div class="sidebar-footer">
        <a href="/privacy">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Kebijakan Privasi
        </a>
        <button id="logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <main class="content">
      <div class="content-header">
        <div></div>
        <div id="account-switcher"></div>
      </div>

      <div class="card">
        <h2 class="page-title" style="font-size:1.3rem;margin:0 0 16px" id="form-title">Publish Post</h2>
        <form id="post-form">
          <div class="field-label">URL gambar</div>
          <input type="text" id="image-url" placeholder="https://example.com/gambar.jpg" />
          <div class="field-label" style="margin-top:10px">Caption (opsional)</div>
          <textarea id="caption" rows="3" placeholder="Tulis caption di sini..."></textarea>
          <button type="submit" class="primary" id="submit-btn" style="width:100%;margin-top:6px">Publish</button>
        </form>
      </div>
      <div id="message" class="row muted"></div>

      <h2 class="page-title" style="font-size:1.2rem;margin-top:28px" id="history-title">Riwayat</h2>
      <div id="list">Memuat...</div>
    </main>
  </div>

  <script src="/account-switcher.js"></script>
  <script>
    const statusEl = document.getElementById('message');
    const list = document.getElementById('list');
    const submitBtn = document.getElementById('submit-btn');
    const formTitle = document.getElementById('form-title');
    const historyTitle = document.getElementById('history-title');

    function showStatus(text) {
      statusEl.textContent = text;
    }

    async function loadPosts() {
      const res = await fetch('/api/posts');
      const data = await res.json();

      if (data.posts.length === 0) {
        list.innerHTML = '<div class="card muted">Belum ada post.</div>';
        return;
      }

      list.innerHTML = '';
      for (const p of data.posts) {
        const el = document.createElement('div');
        el.className = 'card post-item';
        el.innerHTML = `
          <img class="post-thumb" src="${p.image_url}" alt="" onerror="this.style.visibility='hidden'" />
          <div class="post-body">
            <span class="badge ${p.status}">${p.status === 'published' ? 'Published' : 'Failed'}</span>
            <div class="post-caption">${p.caption || '<span class="muted">(tanpa caption)</span>'}</div>
            ${p.status === 'failed' ? `<div class="post-error">${p.error_message || ''}</div>` : ''}
            <div class="post-meta">${new Date(p.created_at).toLocaleString('id-ID')}</div>
          </div>
        `;
        list.appendChild(el);
      }
    }

    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const imageUrl = document.getElementById('image-url').value.trim();
      const caption = document.getElementById('caption').value.trim();
      if (!imageUrl) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spin"></span>Mempublikasikan...';
      showStatus('');

      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageUrl, caption: caption || undefined }),
      });
      const data = await res.json();

      submitBtn.disabled = false;
      submitBtn.textContent = 'Publish';

      if (res.ok) {
        showStatus('Berhasil publish.');
        document.getElementById('post-form').reset();
        loadPosts();
      } else {
        showStatus('Gagal: ' + (data.error || 'tidak diketahui'));
        loadPosts();
      }
    });

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    initAccountSwitcher((connectionId) => {
      const select = document.getElementById('account-switcher-select');
      const label = select ? select.selectedOptions[0].textContent : '';
      formTitle.innerHTML = `Publish Post untuk <span style="color:var(--nc-green-600)">${label}</span>`;
      historyTitle.innerHTML = `Riwayat Post <span style="color:var(--nc-green-600)">${label}</span>`;
      loadPosts();
    });
  </script>
</body>
</html>
