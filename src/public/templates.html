<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Template Balasan — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .field-label { font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .template-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .template-body { flex: 1; min-width: 0; }
    .template-title { font-weight: 700; }
    .template-text { margin: 4px 0; white-space: pre-wrap; color: var(--nc-text-muted); }
    .template-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .template-actions button { padding: 6px 12px; font-size: 0.85rem; }
    .loading-spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.5); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="/logo.png" alt="NC-IG" /><span>NC-IG</span></div>
      <nav class="sidebar-nav">
        <a href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          Beranda
        </a>
        <a href="/connection.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Koneksi
        </a>
        <a href="/dm.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          DM
        </a>
        <a href="/comments.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Komentar
        </a>
        <a href="/posts.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Posts
        </a>
        <a href="/stories.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          Stories
        </a>
        <a href="/templates.html" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="11" y2="11"/></svg>
          Template Balasan
        </a>
      </nav>
      <div class="sidebar-glow"></div>
      <div class="sidebar-footer">
        <a href="/privacy">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Kebijakan Privasi
        </a>
        <button id="logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <main class="content">
      <div class="content-header">
        <div>
          <h1 class="page-title" id="form-title">Template Balasan</h1>
          <p class="page-subtitle">Siapkan teks balasan siap pakai untuk DM &amp; Komentar.</p>
        </div>
        <div id="account-switcher"></div>
      </div>

      <div class="card">
        <h2 class="page-title" style="font-size:1.2rem;margin:0 0 16px" id="editor-title">Tambah Template Baru</h2>
        <form id="template-form">
          <input type="hidden" id="edit-id" />
          <div class="field-label">Judul</div>
          <input type="text" id="title" placeholder="Contoh: Ucapan Terima Kasih" />
          <div class="field-label" style="margin-top:10px">Isi Balasan</div>
          <textarea id="text" rows="3" placeholder="Tulis teks balasan di sini..."></textarea>
          <div style="display:flex;gap:10px;margin-top:6px">
            <button type="submit" class="primary" id="submit-btn" style="flex:1">Simpan Template</button>
            <button type="button" id="cancel-edit" style="display:none">Batal</button>
          </div>
        </form>
      </div>
      <div id="message" class="row muted"></div>

      <h2 class="page-title" style="font-size:1.2rem;margin-top:28px">Daftar Template</h2>
      <div id="list">Memuat...</div>
    </main>
  </div>

  <script src="/account-switcher.js"></script>
  <script>
    const statusEl = document.getElementById('message');
    const list = document.getElementById('list');
    const form = document.getElementById('template-form');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-edit');
    const editorTitle = document.getElementById('editor-title');
    const editIdInput = document.getElementById('edit-id');
    const titleInput = document.getElementById('title');
    const textInput = document.getElementById('text');

    function showStatus(text) {
      statusEl.textContent = text;
    }

    function resetForm() {
      editIdInput.value = '';
      titleInput.value = '';
      textInput.value = '';
      editorTitle.textContent = 'Tambah Template Baru';
      submitBtn.textContent = 'Simpan Template';
      cancelBtn.style.display = 'none';
    }

    async function loadTemplates() {
      const res = await fetch('/api/templates');
      const data = await res.json();

      if (!res.ok) {
        list.innerHTML = `<div class="card muted">${data.error || 'Gagal memuat template.'}</div>`;
        return;
      }

      if (data.templates.length === 0) {
        list.innerHTML = '<div class="card muted">Belum ada template balasan.</div>';
        return;
      }

      list.innerHTML = '';
      for (const t of data.templates) {
        const el = document.createElement('div');
        el.className = 'card template-item';
        el.innerHTML = `
          <div class="template-body">
            <div class="template-title">${t.title}</div>
            <div class="template-text">${t.text}</div>
          </div>
          <div class="template-actions">
            <button type="button" data-action="edit">Edit</button>
            <button type="button" class="danger" data-action="delete">Hapus</button>
          </div>
        `;
        el.querySelector('[data-action="edit"]').onclick = () => {
          editIdInput.value = t.id;
          titleInput.value = t.title;
          textInput.value = t.text;
          editorTitle.textContent = 'Edit Template';
          submitBtn.textContent = 'Update Template';
          cancelBtn.style.display = 'inline-block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        el.querySelector('[data-action="delete"]').onclick = async () => {
          if (!confirm(`Hapus template "${t.title}"?`)) return;
          const res = await fetch('/api/templates/' + t.id, { method: 'DELETE' });
          const data = await res.json();
          if (res.ok) {
            loadTemplates();
          } else {
            showStatus('Gagal menghapus: ' + (data.error || 'tidak diketahui'));
          }
        };
        list.appendChild(el);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const text = textInput.value.trim();
      if (!title || !text) return;

      const editId = editIdInput.value;
      const url = editId ? '/api/templates/' + editId : '/api/templates';
      const method = editId ? 'PUT' : 'POST';

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spin"></span>Menyimpan...';
      showStatus('');

      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, text }),
      });
      const data = await res.json();

      submitBtn.disabled = false;

      if (res.ok) {
        showStatus('Berhasil disimpan.');
        resetForm();
        loadTemplates();
      } else {
        submitBtn.textContent = editId ? 'Update Template' : 'Simpan Template';
        showStatus('Gagal: ' + (data.error || 'tidak diketahui'));
      }
    });

    cancelBtn.addEventListener('click', resetForm);

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    initAccountSwitcher((connectionId) => {
      const select = document.getElementById('account-switcher-select');
      const label = select ? select.selectedOptions[0].textContent : '';
      resetForm();
      document.querySelector('.page-subtitle').innerHTML =
        `Siapkan teks balasan siap pakai untuk <span style="color:var(--nc-green-600)">${label}</span>`;
      loadTemplates();
    });
  </script>
</body>
</html>
