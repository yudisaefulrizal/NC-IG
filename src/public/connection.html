<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connection — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .account-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px 20px; margin-top: 16px; }
    .account-card .result { margin-top: 10px; white-space: pre-wrap; font-size: 0.85rem; background: #fafafa; padding: 8px; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <h1>NC-IG</h1>
  <p class="muted">Instagram API Integration Sandbox</p>

  <nav>
    <a href="/">Home</a>
    <a href="/connection.html" class="active">Connection</a>
    <a href="/dm.html">DM</a>
    <a href="/comments.html">Comments</a>
    <a href="/posts.html">Posts</a>
    <a href="/stories.html">Stories</a>
  </nav>

  <p class="row"><button id="add-account">+ Hubungkan Akun Baru</button></p>

  <div id="list">Memuat...</div>

  <footer><button id="logout">Logout</button></footer>

  <script>
    const list = document.getElementById('list');

    document.getElementById('add-account').onclick = () => {
      window.location.href = '/auth/instagram';
    };

    async function loadConnections() {
      const res = await fetch('/api/connection');
      const data = await res.json();

      if (data.connections.length === 0) {
        list.innerHTML = '<div class="card muted">Belum ada akun Instagram terhubung.</div>';
        return;
      }

      list.innerHTML = '';
      for (const c of data.connections) {
        const el = document.createElement('div');
        el.className = 'account-card';
        el.innerHTML = `
          <strong>@${c.username}</strong>
          <div class="row">Account ID: <code>${c.instagramUserId}</code></div>
          <div class="row muted">Scopes: ${c.scopes.join(', ')}</div>
          <div class="row muted">Token expires: ${new Date(c.tokenExpiresAt).toLocaleString()}</div>
          <div class="row">
            <button class="test-api">Test API</button>
            <button class="test-publish">Test Publish</button>
            <button class="disconnect">Disconnect</button>
          </div>
          <div class="result"></div>
        `;
        list.appendChild(el);

        const resultEl = el.querySelector('.result');
        function showResult(text) {
          resultEl.style.display = 'block';
          resultEl.textContent = text;
        }

        el.querySelector('.test-api').onclick = async () => {
          showResult('Memanggil API...');
          const r = await fetch(`/api/connection/${c.id}/test-api`, { method: 'POST' });
          showResult(JSON.stringify(await r.json(), null, 2));
        };

        el.querySelector('.test-publish').onclick = async () => {
          showResult('Publishing (bisa beberapa detik)...');
          const r = await fetch(`/api/connection/${c.id}/test-publish`, { method: 'POST' });
          showResult(JSON.stringify(await r.json(), null, 2));
        };

        el.querySelector('.disconnect').onclick = async () => {
          await fetch(`/api/connection/${c.id}/disconnect`, { method: 'POST' });
          loadConnections();
        };
      }
    }

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    const params = new URLSearchParams(window.location.search);
    if (params.get('connect') === 'success') {
      const note = document.createElement('p');
      note.className = 'row muted';
      note.textContent = 'Berhasil terhubung!';
      list.before(note);
    }
    if (params.get('connect') === 'cancelled') {
      const note = document.createElement('p');
      note.className = 'row muted';
      note.textContent = 'Anda membatalkan proses connect.';
      list.before(note);
    }

    loadConnections();
  </script>
</body>
</html>
