<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connection — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .account-card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .account-card-head h3 { margin: 0; font-size: 1.15rem; }
    .account-card-actions { display: flex; gap: 8px; align-items: center; }
    .account-card-actions .toggle { background: transparent; border: none; padding: 6px; }
    .account-card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
    .account-card-body .field-label { font-size: 0.8rem; color: var(--nc-text-muted); margin-bottom: 6px; }
    .scope-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .banner-success { display: flex; gap: 12px; align-items: flex-start; background: var(--nc-green-bg); color: var(--nc-green-text); border-radius: var(--nc-radius-md); padding: 14px 18px; margin-bottom: 20px; }
    .banner-success strong { display: block; }
    @media (max-width: 720px) { .account-card-body { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="/logo.png" alt="NC-IG" /><span>NC-IG</span></div>
      <nav class="sidebar-nav">
        <a href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          Beranda
        </a>
        <a href="/connection.html" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Koneksi
        </a>
        <a href="/dm.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          DM
        </a>
        <a href="/comments.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Komentar
        </a>
        <a href="/posts.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Posts
        </a>
        <a href="/stories.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          Stories
        </a>
      </nav>
      <div class="sidebar-glow"></div>
      <div class="sidebar-footer">
        <button id="logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <main class="content">
      <div class="content-header">
        <div>
          <h1 class="page-title">Koneksi Instagram</h1>
          <p class="page-subtitle">Kelola akun Instagram yang terhubung ke NC-IG</p>
        </div>
        <button id="add-account" class="primary">+ Hubungkan Akun Baru</button>
      </div>

      <div id="banner"></div>
      <div id="list">Memuat...</div>
    </main>
  </div>

  <script>
    const list = document.getElementById('list');
    const banner = document.getElementById('banner');

    document.getElementById('add-account').onclick = () => {
      window.location.href = '/auth/instagram';
    };

    async function loadConnections() {
      const res = await fetch('/api/connection');
      const data = await res.json();

      if (data.connections.length === 0) {
        list.innerHTML = '<div class="card muted">Belum ada akun Instagram terhubung.</div>';
        return;
      }

      list.innerHTML = '';
      data.connections.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
          <div class="account-card-head">
            <h3>@${c.username}</h3>
            <div class="account-card-actions">
              <button class="test-api">Test API</button>
              <button class="test-publish">Test Publish</button>
              <button class="disconnect danger">Disconnect</button>
              <button class="toggle" aria-label="Perluas/ciutkan">
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
            </div>
          </div>
          <div class="account-card-body" ${i === 0 ? '' : 'style="display:none"'}>
            <div>
              <div class="field-label">Account ID</div>
              <code>${c.instagramUserId}</code>
              <div class="field-label" style="margin-top:14px">Token expires</div>
              <div>${new Date(c.tokenExpiresAt).toLocaleString('id-ID')}</div>
            </div>
            <div>
              <div class="field-label">Izin yang diberikan</div>
              <div class="scope-list">${c.scopes.map((s) => `<span class="badge scope">${s}</span>`).join('')}</div>
            </div>
          </div>
          <div class="json-viewer" style="display:none"></div>
        `;
        list.appendChild(el);

        const body = el.querySelector('.account-card-body');
        const chevron = el.querySelector('.chevron');
        el.querySelector('.toggle').onclick = () => {
          const show = body.style.display === 'none';
          body.style.display = show ? 'grid' : 'none';
          chevron.style.transform = show ? 'rotate(180deg)' : 'rotate(0)';
        };
        if (i === 0) chevron.style.transform = 'rotate(180deg)';

        const resultEl = el.querySelector('.json-viewer');
        function showResult(text) {
          resultEl.style.display = 'block';
          resultEl.textContent = text;
        }

        el.querySelector('.test-api').onclick = async () => {
          showResult('Memanggil API...');
          const r = await fetch(`/api/connection/${c.id}/test-api`, { method: 'POST' });
          showResult(JSON.stringify(await r.json(), null, 2));
        };

        el.querySelector('.test-publish').onclick = async () => {
          showResult('Publishing (bisa beberapa detik)...');
          const r = await fetch(`/api/connection/${c.id}/test-publish`, { method: 'POST' });
          showResult(JSON.stringify(await r.json(), null, 2));
        };

        el.querySelector('.disconnect').onclick = async () => {
          await fetch(`/api/connection/${c.id}/disconnect`, { method: 'POST' });
          loadConnections();
        };
      });
    }

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    const params = new URLSearchParams(window.location.search);
    if (params.get('connect') === 'success') {
      banner.innerHTML = `
        <div class="banner-success">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="9 12 12 15 16 9"/></svg>
          <div><strong>Berhasil terhubung!</strong>Akun Instagram berhasil dihubungkan dan siap digunakan.</div>
        </div>
      `;
    }
    if (params.get('connect') === 'cancelled') {
      banner.innerHTML = '<p class="row muted">Anda membatalkan proses connect.</p>';
    }

    loadConnections();
  </script>
</body>
</html>
