<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .account-summary { border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px 18px; margin-top: 12px; cursor: pointer; }
    .account-summary:hover { background: #f7f7f7; }
  </style>
</head>
<body>
  <h1>NC-IG</h1>
  <p class="muted">Instagram API Integration Sandbox</p>

  <nav>
    <a href="/" class="active">Home</a>
    <a href="/connection.html">Connection</a>
    <a href="/dm.html">DM</a>
    <a href="/comments.html">Comments</a>
    <a href="/posts.html">Posts</a>
    <a href="/stories.html">Stories</a>
  </nav>

  <div id="list">Memuat...</div>

  <footer><button id="logout">Logout</button></footer>

  <script>
    const list = document.getElementById('list');

    async function loadSummary() {
      const res = await fetch('/api/connection');
      const data = await res.json();

      if (data.connections.length === 0) {
        list.innerHTML = `
          <div class="card">
            <strong>Belum ada akun Instagram terhubung.</strong>
            <div class="row muted">Buka halaman <a href="/connection.html">Connection</a> untuk menghubungkan akun.</div>
          </div>
        `;
        return;
      }

      list.innerHTML = '';
      for (const c of data.connections) {
        const el = document.createElement('div');
        el.className = 'account-summary';
        el.innerHTML = `
          <strong>@${c.username}</strong>
          <div class="row muted">Token expires: ${new Date(c.tokenExpiresAt).toLocaleString()}</div>
        `;
        el.onclick = () => { window.location.href = '/connection.html'; };
        list.appendChild(el);
      }
    }

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    loadSummary();
  </script>
</body>
</html>
