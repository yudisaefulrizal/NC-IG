<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>NC-IG</h1>
  <p class="muted">Instagram API Integration Sandbox</p>

  <nav>
    <a href="/" class="active">Home</a>
    <a href="/connection.html">Connection</a>
    <a href="/dm.html">DM</a>
    <a href="/comments.html">Comments</a>
    <a href="/posts.html">Posts</a>
    <a href="/stories.html">Stories</a>
  </nav>

  <div class="card" id="app">Memuat status...</div>

  <footer><button id="logout">Logout</button></footer>

  <script>
    const app = document.getElementById('app');

    async function loadSummary() {
      const res = await fetch('/api/connection/status');
      const data = await res.json();

      if (!data.connected) {
        app.innerHTML = `
          <strong>Belum ada akun Instagram terhubung.</strong>
          <div class="row muted">Buka halaman <a href="/connection.html">Connection</a> untuk menghubungkan akun.</div>
        `;
        return;
      }

      app.innerHTML = `
        <strong>Instagram Connected</strong>
        <div class="row">Username: <strong>@${data.username}</strong></div>
        <div class="row muted">Token expires: ${new Date(data.tokenExpiresAt).toLocaleString()}</div>
        <div class="row muted">Kelola koneksi &amp; testing di halaman <a href="/connection.html">Connection</a>.</div>
      `;
    }

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    loadSummary();
  </script>
</body>
</html>
