<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stories — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .story-note { display: flex; align-items: center; gap: 8px; color: var(--nc-text-muted); font-size: 0.88rem; margin-top: 8px; }
    .story-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 16px; }
    .story-card { position: relative; border-radius: var(--nc-radius-lg); overflow: hidden; aspect-ratio: 3/4.2; background: #eee; box-shadow: var(--nc-shadow); }
    .story-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .story-card .badge { position: absolute; top: 10px; left: 10px; }
    .story-card .date { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 10px; font-size: 0.75rem; color: #fff; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); }
    .loading-spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.5); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="/logo.png" alt="NC-IG" /><span>NC-IG</span></div>
      <nav class="sidebar-nav">
        <a href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          Beranda
        </a>
        <a href="/connection.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Koneksi
        </a>
        <a href="/dm.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          DM
        </a>
        <a href="/comments.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Komentar
        </a>
        <a href="/posts.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Posts
        </a>
        <a href="/stories.html" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          Stories
        </a>
      </nav>
      <div class="sidebar-glow"></div>
      <div class="sidebar-footer">
        <button id="logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <main class="content">
      <div class="content-header">
        <div></div>
        <div id="account-switcher"></div>
      </div>

      <div class="card">
        <h2 class="page-title" style="font-size:1.3rem;margin:0 0 16px" id="form-title">Publish Story</h2>
        <div class="field-label" style="font-weight:600;font-size:0.9rem;margin-bottom:6px">URL gambar</div>
        <form id="story-form">
          <input type="text" id="image-url" placeholder="https://" />
          <button type="submit" class="primary" id="submit-btn" style="width:100%;margin-top:6px">Publish Story</button>
        </form>
        <div class="story-note">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Story akan expire dalam 24 jam di Instagram. Riwayat lokal tetap tersimpan.
        </div>
      </div>
      <div id="message" class="row muted"></div>

      <h2 class="page-title" style="font-size:1.2rem;margin-top:28px" id="history-title">Riwayat Story</h2>
      <div id="list">Memuat...</div>
    </main>
  </div>

  <script src="/account-switcher.js"></script>
  <script>
    const statusEl = document.getElementById('message');
    const list = document.getElementById('list');
    const submitBtn = document.getElementById('submit-btn');
    const formTitle = document.getElementById('form-title');
    const historyTitle = document.getElementById('history-title');

    function showStatus(text) {
      statusEl.textContent = text;
    }

    async function loadStories() {
      const res = await fetch('/api/stories');
      const data = await res.json();

      if (data.stories.length === 0) {
        list.innerHTML = '<div class="card muted">Belum ada story.</div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'story-grid';
      for (const s of data.stories) {
        const el = document.createElement('div');
        el.className = 'story-card';
        el.innerHTML = `
          <img src="${s.image_url}" alt="" onerror="this.style.visibility='hidden'" />
          <span class="badge ${s.status}">${s.status === 'published' ? 'Published' : 'Failed'}</span>
          <div class="date">${new Date(s.created_at).toLocaleString('id-ID')}</div>
        `;
        grid.appendChild(el);
      }
      list.innerHTML = '';
      list.appendChild(grid);
    }

    document.getElementById('story-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const imageUrl = document.getElementById('image-url').value.trim();
      if (!imageUrl) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spin"></span>Mempublikasikan...';
      showStatus('');

      const res = await fetch('/api/stories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageUrl }),
      });
      const data = await res.json();

      submitBtn.disabled = false;
      submitBtn.textContent = 'Publish Story';

      if (res.ok) {
        showStatus('Berhasil publish.');
        document.getElementById('story-form').reset();
        loadStories();
      } else {
        showStatus('Gagal: ' + (data.error || 'tidak diketahui'));
        loadStories();
      }
    });

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    initAccountSwitcher((connectionId) => {
      const select = document.getElementById('account-switcher-select');
      const label = select ? select.selectedOptions[0].textContent : '';
      formTitle.innerHTML = `Publish Story untuk <span style="color:var(--nc-green-600)">${label}</span>`;
      historyTitle.innerHTML = `Riwayat Story <span style="color:var(--nc-green-600)">${label}</span>`;
      loadStories();
    });
  </script>
</body>
</html>
