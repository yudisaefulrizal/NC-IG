<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stories — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .story-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 16px; margin-top: 12px; }
    .story-item img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 8px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
    .badge.published { background: #dcfce7; color: #166534; }
    .badge.failed { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h1>NC-IG</h1>
  <p class="muted">Instagram API Integration Sandbox</p>

  <nav>
    <a href="/">Home</a>
    <a href="/connection.html">Connection</a>
    <a href="/dm.html">DM</a>
    <a href="/comments.html">Comments</a>
    <a href="/posts.html">Posts</a>
    <a href="/stories.html" class="active">Stories</a>
  </nav>

  <div class="card">
    <strong>Publish story baru</strong>
    <p class="muted">Story otomatis kedaluwarsa 24 jam di Instagram (di luar kendali riwayat lokal ini). Tanpa caption — Stories tidak mendukungnya.</p>
    <form id="story-form">
      <div class="row">
        <label>URL gambar (harus bisa diakses publik)</label>
        <input type="text" id="image-url" placeholder="https://.../gambar.jpg" />
      </div>
      <button type="submit">Publish Story</button>
    </form>
  </div>

  <div id="message" class="row muted"></div>

  <h3>Riwayat</h3>
  <div id="list">Memuat...</div>

  <footer><button id="logout">Logout</button></footer>

  <script>
    const statusEl = document.getElementById('message');
    const list = document.getElementById('list');

    function showStatus(text) {
      statusEl.textContent = text;
    }

    async function loadStories() {
      const res = await fetch('/api/stories');
      const data = await res.json();

      if (data.stories.length === 0) {
        list.innerHTML = '<div class="card muted">Belum ada story.</div>';
        return;
      }

      list.innerHTML = '';
      for (const s of data.stories) {
        const el = document.createElement('div');
        el.className = 'story-item';
        el.innerHTML = `
          <span class="badge ${s.status}">${s.status}</span>
          <div class="row muted">${new Date(s.created_at).toLocaleString()}</div>
          ${s.status === 'failed' ? `<div class="row muted">${s.error_message || ''}</div>` : ''}
          <img src="${s.image_url}" alt="" onerror="this.style.display='none'" />
        `;
        list.appendChild(el);
      }
    }

    document.getElementById('story-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const imageUrl = document.getElementById('image-url').value.trim();
      if (!imageUrl) return;

      showStatus('Publishing (bisa beberapa detik)...');
      const res = await fetch('/api/stories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageUrl }),
      });
      const data = await res.json();

      if (res.ok) {
        showStatus('Berhasil publish.');
        document.getElementById('story-form').reset();
        loadStories();
      } else {
        showStatus('Gagal: ' + (data.error || 'tidak diketahui'));
        loadStories();
      }
    });

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    loadStories();
  </script>
</body>
</html>
