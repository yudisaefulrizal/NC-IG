<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DM — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .dm-layout { display: flex; gap: 18px; margin-top: 4px; }
    .dm-threads { width: 280px; flex-shrink: 0; background: var(--nc-card-bg); border: 1px solid var(--nc-border); border-radius: var(--nc-radius-lg); box-shadow: var(--nc-shadow); max-height: 600px; overflow-y: auto; padding: 8px; }
    .dm-threads-title { font-weight: 700; padding: 10px 12px 6px; }
    .dm-thread-item { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--nc-radius-md); cursor: pointer; }
    .dm-thread-item:hover { background: #f5f7fa; }
    .dm-thread-item.active { background: var(--nc-green-bg); }
    .dm-thread-info { min-width: 0; flex: 1; }
    .dm-thread-name { font-weight: 600; font-size: 0.9rem; }
    .dm-thread-preview { font-size: 0.8rem; color: var(--nc-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dm-conversation { flex: 1; background: var(--nc-card-bg); border: 1px solid var(--nc-border); border-radius: var(--nc-radius-lg); box-shadow: var(--nc-shadow); padding: 20px; display: flex; flex-direction: column; min-height: 500px; }
    .dm-conv-header { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--nc-border); }
    .dm-conv-header .name { font-weight: 700; }
    .dm-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; margin-bottom: 14px; }
    .dm-msg { margin: 5px 0; padding: 10px 14px; border-radius: 14px; max-width: 70%; font-size: 0.92rem; white-space: pre-wrap; }
    .dm-msg.inbound { background: #eef1f5; align-self: flex-start; border-bottom-left-radius: 4px; }
    .dm-msg.outbound { background: var(--nc-green-bg); color: var(--nc-green-text); align-self: flex-end; border-bottom-right-radius: 4px; }
    .dm-reply-form { display: flex; gap: 10px; flex-wrap: wrap; }
    .dm-reply-form input { flex: 1; margin-bottom: 0; min-width: 160px; }
    .dm-template-select { max-width: 170px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="/logo.png" alt="NC-IG" /><span>NC-IG</span></div>
      <nav class="sidebar-nav">
        <a href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          Beranda
        </a>
        <a href="/connection.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Koneksi
        </a>
        <a href="/dm.html" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          DM
        </a>
        <a href="/comments.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Komentar
        </a>
        <a href="/posts.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Posts
        </a>
        <a href="/stories.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          Stories
        </a>
        <a href="/templates.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="11" y2="11"/></svg>
          Template Balasan
        </a>
      </nav>
      <div class="sidebar-glow"></div>
      <div class="sidebar-footer">
        <a href="/privacy">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Kebijakan Privasi
        </a>
        <button id="logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <main class="content">
      <div class="content-header">
        <div>
          <h1 class="page-title">Pesan Langsung</h1>
        </div>
        <div id="account-switcher"></div>
      </div>

      <div class="dm-layout">
        <div class="dm-threads">
          <div class="dm-threads-title">Percakapan</div>
          <div id="thread-list">Memuat...</div>
        </div>
        <div class="dm-conversation">
          <div id="conv-header" style="display:none" class="dm-conv-header"></div>
          <div class="dm-messages" id="messages">Pilih percakapan di sebelah kiri.</div>
          <form id="reply-form" class="dm-reply-form" style="display: none">
            <select id="template-select" class="dm-template-select">
              <option value="">Template...</option>
            </select>
            <input type="text" id="reply-text" placeholder="Tulis balasan..." autocomplete="off" />
            <button type="submit" class="primary">Kirim</button>
          </form>
          <div id="message" class="row muted"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/account-switcher.js"></script>
  <script>
    let activeThreadId = null;
    let threadsCache = [];
    const threadList = document.getElementById('thread-list');
    const convHeader = document.getElementById('conv-header');
    const messagesEl = document.getElementById('messages');
    const replyForm = document.getElementById('reply-form');
    const statusEl = document.getElementById('message');
    const templateSelect = document.getElementById('template-select');

    function showStatus(text) {
      statusEl.textContent = text;
    }

    async function loadTemplateOptions() {
      const res = await fetch('/api/templates');
      const data = await res.json();
      templateSelect.innerHTML = '<option value="">Template...</option>';
      if (!res.ok) return;
      for (const t of data.templates) {
        const opt = document.createElement('option');
        opt.value = t.text;
        opt.textContent = t.title;
        templateSelect.appendChild(opt);
      }
    }

    templateSelect.addEventListener('change', () => {
      if (templateSelect.value) {
        document.getElementById('reply-text').value = templateSelect.value;
        templateSelect.value = '';
      }
    });

    function threadLabel(thread) {
      return thread.username ? '@' + thread.username : thread.ig_scoped_id;
    }

    function avatarHtml(name) {
      return `<div class="avatar" style="background:${avatarColorFor(name)}">${avatarInitial(name)}</div>`;
    }

    async function loadThreads() {
      const res = await fetch('/api/messages/threads');
      const data = await res.json();
      threadsCache = data.threads;

      if (data.threads.length === 0) {
        threadList.innerHTML = '<div class="row muted" style="padding:10px 12px">Belum ada percakapan.</div>';
        return;
      }

      threadList.innerHTML = '';
      for (const thread of data.threads) {
        const label = threadLabel(thread);
        const el = document.createElement('div');
        el.className = 'dm-thread-item' + (thread.id === activeThreadId ? ' active' : '');
        el.innerHTML = `
          ${avatarHtml(label)}
          <div class="dm-thread-info">
            <div class="dm-thread-name">${label}</div>
            <div class="dm-thread-preview">${new Date(thread.last_message_at).toLocaleString('id-ID')}</div>
          </div>
        `;
        el.onclick = () => openThread(thread.id);
        threadList.appendChild(el);
      }
    }

    async function openThread(threadId) {
      activeThreadId = threadId;
      await loadThreads();

      const res = await fetch('/api/messages/threads/' + threadId);
      if (!res.ok) {
        messagesEl.textContent = 'Gagal memuat percakapan.';
        return;
      }
      const data = await res.json();
      const label = threadLabel(data.thread);

      convHeader.style.display = 'flex';
      convHeader.innerHTML = `${avatarHtml(label)}<div><div class="name">${label}</div></div>`;

      messagesEl.innerHTML = '';
      for (const msg of data.messages) {
        const el = document.createElement('div');
        el.className = 'dm-msg ' + msg.direction;
        el.textContent = msg.text || '(tanpa teks)';
        messagesEl.appendChild(el);
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
      replyForm.style.display = 'flex';
    }

    replyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeThreadId) return;

      const input = document.getElementById('reply-text');
      const text = input.value.trim();
      if (!text) return;

      showStatus('Mengirim...');
      const res = await fetch('/api/messages/threads/' + activeThreadId + '/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();

      if (res.ok) {
        input.value = '';
        showStatus('');
        openThread(activeThreadId);
      } else {
        showStatus('Pesan tidak dapat dikirim: ' + (data.error || 'tidak diketahui'));
      }
    });

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    initAccountSwitcher(() => {
      activeThreadId = null;
      convHeader.style.display = 'none';
      messagesEl.textContent = 'Pilih percakapan di sebelah kiri.';
      replyForm.style.display = 'none';
      loadThreads();
      loadTemplateOptions();
    });
    setInterval(loadThreads, 10000); // polling ringan, tanpa SSE/WebSocket
  </script>
</body>
</html>
