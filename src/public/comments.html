<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comments — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .comment-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .comment-item.replied { background: #fafbfc; }
    .comment-body { flex: 1; min-width: 0; }
    .comment-username { font-weight: 700; }
    .comment-text { margin: 4px 0; }
    .comment-reply-form { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .comment-reply-form input { flex: 1; margin-bottom: 0; min-width: 160px; }
    .comment-reply-form select { max-width: 160px; margin-bottom: 0; }
    .badge.unreplied svg, .badge.replied svg { width: 13px; height: 13px; }
    .info-banner { display: flex; align-items: center; gap: 10px; background: #eef2ff; color: #3730a3; border-radius: var(--nc-radius-md); padding: 12px 16px; margin-top: 18px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="/logo.png" alt="NC-IG" /><span>NC-IG</span></div>
      <nav class="sidebar-nav">
        <a href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          Beranda
        </a>
        <a href="/connection.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Koneksi
        </a>
        <a href="/dm.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          DM
        </a>
        <a href="/comments.html" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Komentar
        </a>
        <a href="/posts.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Posts
        </a>
        <a href="/stories.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          Stories
        </a>
        <a href="/templates.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="11" y2="11"/></svg>
          Template Balasan
        </a>
      </nav>
      <div class="sidebar-glow"></div>
      <div class="sidebar-footer">
        <a href="/privacy">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Kebijakan Privasi
        </a>
        <button id="logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <main class="content">
      <div class="content-header">
        <div>
          <h1 class="page-title">Komentar Masuk</h1>
          <p class="page-subtitle" id="subtitle">Memuat...</p>
        </div>
        <div id="account-switcher"></div>
      </div>

      <div id="list"></div>
      <div id="message" class="row muted"></div>
      <div class="info-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Hanya komentar tingkat atas yang dapat dibalas.
      </div>
    </main>
  </div>

  <script src="/account-switcher.js"></script>
  <script>
    const list = document.getElementById('list');
    const subtitle = document.getElementById('subtitle');
    const statusEl = document.getElementById('message');
    let templatesCache = [];

    function showStatus(text) {
      statusEl.textContent = text;
    }

    async function loadTemplateCache() {
      const res = await fetch('/api/templates');
      const data = await res.json();
      templatesCache = res.ok ? data.templates : [];
    }

    function fillTemplateOptions(select) {
      select.innerHTML = '<option value="">Template...</option>';
      for (const t of templatesCache) {
        const opt = document.createElement('option');
        opt.value = t.text;
        opt.textContent = t.title;
        select.appendChild(opt);
      }
    }

    async function loadComments() {
      const res = await fetch('/api/comments');
      const data = await res.json();

      if (data.comments.length === 0) {
        subtitle.textContent = 'Belum ada komentar masuk';
        list.innerHTML = '<div class="card muted">Belum ada komentar masuk.</div>';
        return;
      }

      subtitle.textContent = `${data.comments.length} komentar`;
      list.innerHTML = '';
      for (const c of data.comments) {
        const isReplied = c.status === 'replied';
        const el = document.createElement('div');
        el.className = 'card comment-item' + (isReplied ? ' replied' : '');
        el.innerHTML = `
          <div class="comment-body">
            <div class="comment-username">@${c.from_username || 'unknown'}</div>
            <div class="comment-text">${c.text || '(tanpa teks)'}</div>
            <div class="muted" style="font-size:0.8rem">${new Date(c.created_at).toLocaleString('id-ID')}</div>
            ${!isReplied ? `
              <form class="comment-reply-form" data-id="${c.id}">
                <select class="template-select"><option value="">Template...</option></select>
                <input type="text" placeholder="Tulis balasan..." autocomplete="off" />
                <button type="submit" class="primary">Balas</button>
              </form>
            ` : ''}
          </div>
          <span class="badge ${c.status}">
            ${isReplied
              ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Sudah dibalas'
              : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Belum dibalas'}
          </span>
        `;
        list.appendChild(el);
      }

      document.querySelectorAll('.comment-reply-form').forEach((form) => {
        const select = form.querySelector('.template-select');
        fillTemplateOptions(select);
        select.addEventListener('change', () => {
          if (select.value) {
            form.querySelector('input').value = select.value;
            select.value = '';
          }
        });

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const commentId = form.dataset.id;
          const input = form.querySelector('input');
          const text = input.value.trim();
          if (!text) return;

          showStatus('Mengirim...');
          const res = await fetch('/api/comments/' + commentId + '/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          });
          const data = await res.json();

          if (res.ok) {
            showStatus('');
            loadComments();
          } else {
            showStatus('Gagal: ' + (data.error || 'tidak diketahui'));
          }
        });
      });
    }

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    initAccountSwitcher(async () => {
      await loadTemplateCache();
      loadComments();
    });
    setInterval(loadComments, 10000);
  </script>
</body>
</html>
