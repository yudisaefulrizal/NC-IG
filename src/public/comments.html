<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comments — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .comment-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 16px; margin-top: 12px; }
    .comment-item.replied { opacity: 0.6; }
    .comment-meta { font-size: 0.8rem; color: #666; margin-bottom: 4px; }
    .comment-reply-form { display: flex; gap: 8px; margin-top: 8px; }
    .comment-reply-form input { flex: 1; margin-bottom: 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
    .badge.unreplied { background: #fef3c7; color: #92400e; }
    .badge.replied { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <h1>NC-IG</h1>
  <p class="muted">Instagram API Integration Sandbox</p>

  <nav>
    <a href="/">Home</a>
    <a href="/connection.html">Connection</a>
    <a href="/dm.html">DM</a>
    <a href="/comments.html" class="active">Comments</a>
    <a href="/posts.html">Posts</a>
    <a href="/stories.html">Stories</a>
    <span id="account-switcher"></span>
  </nav>

  <div id="list">Memuat...</div>
  <div id="message" class="row muted"></div>

  <footer><button id="logout">Logout</button></footer>

  <script src="/account-switcher.js"></script>
  <script>
    const list = document.getElementById('list');
    const statusEl = document.getElementById('message');

    function showStatus(text) {
      statusEl.textContent = text;
    }

    async function loadComments() {
      const res = await fetch('/api/comments');
      const data = await res.json();

      if (data.comments.length === 0) {
        list.innerHTML = '<div class="card muted">Belum ada komentar masuk.</div>';
        return;
      }

      list.innerHTML = '';
      for (const c of data.comments) {
        const el = document.createElement('div');
        el.className = 'comment-item' + (c.status === 'replied' ? ' replied' : '');
        el.innerHTML = `
          <div class="comment-meta">
            @${c.from_username || 'unknown'} · <span class="badge ${c.status}">${c.status}</span>
          </div>
          <div>${c.text || '(tanpa teks)'}</div>
          ${c.status === 'unreplied' ? `
            <form class="comment-reply-form" data-id="${c.id}">
              <input type="text" placeholder="Tulis balasan..." autocomplete="off" />
              <button type="submit">Balas</button>
            </form>
          ` : ''}
        `;
        list.appendChild(el);
      }

      document.querySelectorAll('.comment-reply-form').forEach((form) => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const commentId = form.dataset.id;
          const input = form.querySelector('input');
          const text = input.value.trim();
          if (!text) return;

          showStatus('Mengirim...');
          const res = await fetch('/api/comments/' + commentId + '/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          });
          const data = await res.json();

          if (res.ok) {
            showStatus('');
            loadComments();
          } else {
            showStatus('Gagal: ' + (data.error || 'tidak diketahui'));
          }
        });
      });
    }

    document.getElementById('logout').onclick = async () => {
      await fetch('/session/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    initAccountSwitcher(() => loadComments());
    setInterval(loadComments, 10000);
  </script>
</body>
</html>
