<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 85%, rgba(34, 197, 94, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(34, 197, 94, 0.10) 0%, transparent 40%),
        var(--nc-bg);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
      padding: 40px 36px;
    }
    .login-card img { width: 96px; margin: 0 auto 8px; display: block; }
    .login-card h1 { font-size: 1.5rem; font-weight: 800; margin: 4px 0 2px; }
    .login-card p.tagline { color: var(--nc-text-muted); margin: 0 0 28px; }
    .login-card button { width: 100%; margin-top: 6px; }
    #message { color: #c0392b; text-align: left; }
  </style>
</head>
<body>
  <div class="card login-card">
    <img src="/logo.png" alt="NC-IG" />
    <h1>NC-IG</h1>
    <p class="tagline">Masuk ke dashboard</p>

    <form id="login-form">
      <input type="password" id="password" placeholder="Password" autofocus />
      <button type="submit" class="primary">Login</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = '';
      const password = document.getElementById('password').value;

      const res = await fetch('/session/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });

      if (res.ok) {
        window.location.href = '/';
        return;
      }

      const data = await res.json().catch(() => ({}));
      message.textContent = data.error || 'Login gagal.';
    });
  </script>
</body>
</html>
