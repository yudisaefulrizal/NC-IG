<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daftar — NC-IG</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 85%, rgba(34, 197, 94, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(34, 197, 94, 0.10) 0%, transparent 40%),
        var(--nc-bg);
    }
    .login-card { width: 100%; max-width: 400px; text-align: center; padding: 40px 36px; }
    .login-card img { width: 96px; margin: 0 auto 8px; display: block; }
    .login-card h1 { font-size: 1.5rem; font-weight: 800; margin: 4px 0 2px; }
    .login-card p.tagline { color: var(--nc-text-muted); margin: 0 0 28px; }
    .login-card button { width: 100%; margin-top: 6px; }
    .login-card input { text-align: left; }
    #message { color: #c0392b; text-align: left; }
    #message.success { color: var(--nc-green-600); }
    .switch-link { margin-top: 18px; font-size: 0.9rem; color: var(--nc-text-muted); }
    .switch-link a { color: var(--nc-green-600); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card login-card">
    <img src="/logo.png" alt="NC-IG" />
    <h1>NC-IG</h1>
    <p class="tagline">Buat akun baru</p>

    <form id="register-form">
      <input type="email" id="email" placeholder="Email" autofocus />
      <input type="password" id="password" placeholder="Password (minimal 8 karakter)" />
      <input type="password" id="password-confirm" placeholder="Ulangi password" />
      <button type="submit" class="primary">Daftar</button>
    </form>
    <div id="message"></div>
    <p class="switch-link">Sudah punya akun? <a href="/login.html">Masuk</a></p>
    <p class="switch-link" style="margin-top:6px">
      Dengan mendaftar, Anda menyetujui <a href="/privacy">Kebijakan Privasi</a> kami.
    </p>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = '';
      message.classList.remove('success');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password-confirm').value;

      if (password !== passwordConfirm) {
        message.textContent = 'Password dan ulangi password tidak sama.';
        return;
      }

      const res = await fetch('/session/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        message.classList.add('success');
        message.textContent = 'Akun berhasil dibuat. Mengalihkan ke halaman login...';
        setTimeout(() => { window.location.href = '/login.html?registered=1'; }, 1200);
        return;
      }

      message.textContent = data.error || 'Gagal mendaftar.';
    });
  </script>
</body>
</html>
